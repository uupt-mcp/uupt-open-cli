version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/uupt-open-cli
    binary: uupt-open-cli
    ldflags:
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: 'uupt-open-cli-{{ .Version }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}-{{ .Arch }}'
    files:
      - configs/defaults.json
      - src: scripts/install.sh
        dst: install.sh
      - src: scripts/install.ps1
        dst: install.ps1

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: uupt-mcp
    name: uupt-open-cli
  mode: replace

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch
